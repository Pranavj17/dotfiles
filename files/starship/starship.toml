# Starship prompt config — https://starship.rs/config
# Requires a Nerd Font (MesloLGS Nerd Font, set in Alacritty).

# Two-line prompt: info line, then a clean input character.
format = """
$directory\
$git_branch\
$git_status\
$nix_shell\
${custom.elixir}\
$ruby\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

add_newline = true        # blank line before each prompt
command_timeout = 2000    # ms; Nix-wrapped BEAM (elixir --version) cold-starts ~1.06s

# Green ❯ on success, red ❯ after a failed command.
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold yellow)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo  = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style = "bold yellow"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?${count}"
modified  = "!${count}"
staged    = "+${count}"
stashed   = "≡"
renamed   = "»${count}"
deleted   = "✘${count}"

# Show "via <icon> <version>" only inside projects that use the language.
[nix_shell]
symbol = " "
style  = "bold blue"
format = 'via [$symbol$state( \($name\))]($style) '

# Starship's built-in elixir module calls `elixir --version` on every prompt
# redraw inside a mix project, paying the ~420ms BEAM cold-start each time.
# Disable it and use [custom.elixir] below, which routes through the
# `elixir-version-cached` wrapper that memoises the version string on disk —
# warm calls ~5ms instead of ~420ms. Cache auto-invalidates when the binary
# changes (key = sha1(binary path + mtime)), so toolchain switches are safe.
[elixir]
disabled = true

[custom.elixir]
description  = "Elixir version (cached) — only inside mix projects"
detect_files = ["mix.exs"]
command      = "$HOME/.local/bin/elixir-version-cached"
symbol       = " "
style        = "bold magenta"
format       = 'via [$symbol$output ]($style)'
shell        = ["bash", "--noprofile", "--norc"]

[ruby]
symbol = " "
style  = "bold red"
format = 'via [$symbol($version )]($style)'

[nodejs]
symbol = " "
style  = "bold green"
format = 'via [$symbol($version )]($style)'

[python]
symbol = " "
style  = "bold yellow"
format = 'via [$symbol($version )]($style)'

# Show how long the previous command took, if non-trivial.
[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "
